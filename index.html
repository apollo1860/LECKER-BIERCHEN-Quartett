<style>
:root{
  --bg-deep:#20242f;
  --bg-panel:#2b3040;
  --gold-1:#ffd24c;
  --gold-2:#f5a623;
  --foam:#f6f4ef;
  --brown:#5c3a21;
  --brown-dark:#3d2513;
  --red:#c0392b;
  --green:#3fae6a;
  --text-dim:#a9adc1;
  --blue:#1e88e5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family: 'Arial Narrow', Arial, sans-serif;
  background:
    radial-gradient(circle at 20% -10%, #3a4054 0%, transparent 55%),
    radial-gradient(circle at 100% 110%, #33384a 0%, transparent 50%),
    var(--bg-deep);
  color:var(--foam);
  min-height:100vh;
  overflow-x:hidden;
}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px;position:relative;}
h1,h2,h3{font-family:'Arial Black', Arial, sans-serif; letter-spacing:0.5px; margin:0;}
.brand{text-align:center;margin:10px 0 22px;}
.brand .eyebrow{font-size:11px; letter-spacing:4px; color:var(--gold-2); text-transform:uppercase; margin-bottom:4px;}
.brand h1{
  font-size:34px; line-height:0.95; text-transform:uppercase;
  background:linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 55%, #c8781a 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand .sub{color:var(--text-dim); font-size:13px; margin-top:6px;}

.card-panel{
  background:var(--bg-panel); border-radius:18px; padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  margin-bottom:16px;
}
label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; letter-spacing:0.5px; text-transform:uppercase;}
input[type=text]{
  width:100%; padding:13px 14px; border-radius:10px; border:1px solid #454b60;
  background:#1c2029; color:var(--foam); font-size:16px; margin-bottom:14px; letter-spacing:1px;
}
input[type=text]:focus{outline:2px solid var(--gold-2); border-color:transparent;}

button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-weight:700; letter-spacing:0.3px;}
.btn-primary{
  width:100%; padding:15px; font-size:16px;
  background:linear-gradient(180deg, var(--gold-1), var(--gold-2));
  color:#3a2205; box-shadow:0 6px 0 #b5750f, 0 10px 18px rgba(0,0,0,0.3);
}
.btn-primary:active{transform:translateY(3px); box-shadow:0 3px 0 #b5750f;}
.btn-secondary{
  width:100%; padding:13px; font-size:14px; margin-top:10px;
  background:transparent; color:var(--gold-1); border:1.5px solid #454b60;
}
.btn-secondary:active{background:rgba(255,255,255,0.05);}
button:disabled{opacity:0.4; cursor:not-allowed;}

.divider{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--text-dim); font-size:12px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#454b60;}

.player-list{list-style:none; margin:0; padding:0;}
.player-list li{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:#1c2029; border-radius:10px; margin-bottom:8px; font-size:15px;
}
.player-list .badge{font-size:10px; background:var(--gold-2); color:#3a2205; padding:2px 8px; border-radius:20px; letter-spacing:0.5px;}

.room-code{
  text-align:center; font-size:30px; font-weight:900; letter-spacing:10px;
  color:var(--gold-1); background:#1c2029; border-radius:12px; padding:14px 0; margin-bottom:8px;
  border:1px dashed #59607a;
}
.hint{text-align:center; color:var(--text-dim); font-size:12px; margin-bottom:10px;}

/* --- Regler / Toggle-Switch --- */
.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid #3a3f52;}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .trlabel{font-size:14px; font-weight:700;}
.toggle-row .trsub{font-size:11px; color:var(--text-dim); margin-top:2px;}
.toggle-row .trstate{font-size:11px; color:var(--gold-2); font-weight:700; text-align:right; min-width:92px;}
.switch{position:relative; display:inline-block; width:50px; height:28px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:#454b60; border-radius:30px; transition:.2s; cursor:pointer;}
.switch .slider::before{content:""; position:absolute; height:22px; width:22px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--blue);}
.switch input:checked + .slider::before{transform:translateX(22px);}
.switch input:disabled + .slider{opacity:0.5; cursor:default;}

/* --- Karten --- */
.beer-card{
  background:linear-gradient(180deg, var(--gold-2) 0%, #d9860f 100%);
  border-radius:16px; padding:16px; position:relative; margin-bottom:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
}
.beer-card .tag{
  position:absolute; top:-10px; right:14px; background:var(--brown-dark); color:var(--gold-1);
  padding:4px 10px; border-radius:6px; font-size:12px; font-weight:800; box-shadow:0 3px 6px rgba(0,0,0,0.3);
}
.beer-card .name{
  background:var(--foam); color:#22252f; text-align:center; font-weight:900; font-size:18px;
  padding:10px 8px; border-radius:10px; text-transform:uppercase; margin-bottom:12px; letter-spacing:0.3px;
}
.card-photo{
  position:relative; width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden;
  background:rgba(0,0,0,0.15); border:3px solid var(--foam); margin-bottom:10px;
  display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
}
.card-photo img{width:100%; height:100%; object-fit:cover; display:block;}

.card-stack{position:relative; margin:0 16px 16px 0;}
.card-stack.stack-1::before{
  content:""; position:absolute; inset:0; border-radius:16px; z-index:-1; opacity:.75;
  background:linear-gradient(180deg, var(--gold-2) 0%, #c97810 100%);
  transform:translate(7px,7px) rotate(1.6deg);
}
.card-stack.stack-2::after{
  content:""; position:absolute; inset:0; border-radius:16px; z-index:-2; opacity:.5;
  background:linear-gradient(180deg, var(--gold-2) 0%, #b56d0d 100%);
  transform:translate(14px,14px) rotate(3.2deg);
}

.stat-row{
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,0.92); color:#22252f; border-radius:8px;
  padding:8px 12px; margin-bottom:7px; font-size:14px; font-weight:700;
}
.stat-row.pickable{cursor:pointer; transition:transform .12s;}
.stat-row.pickable:active{transform:scale(0.97);}
.stat-row .arrow{font-size:11px; color:#8a6d00;}
.beer-card .tagline{color:#3a2205; font-size:12px; font-weight:700; margin-top:8px;}
.beer-card .flavor{color:#4a3210; font-size:11.5px; line-height:1.4; margin-top:4px;}

.turn-banner{
  text-align:center; padding:10px; border-radius:10px; background:#1c2029; margin-bottom:14px;
  font-size:14px; color:var(--gold-1); font-weight:700;
}
.mini-card{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:#1c2029; border-radius:10px; padding:9px 12px; margin-bottom:7px; font-size:13px;
}
.mini-card .val{font-weight:900; color:var(--gold-1); font-size:16px;}
.mini-card.you-row{border:1px solid var(--gold-2);}
.mini-card.win-row{border:1px solid var(--green); background:#20302a;}

.result-msg{text-align:center; font-size:16px; font-weight:800; color:var(--gold-1); margin:10px 0 14px;}
.pot-note{text-align:center; font-size:12px; color:var(--red); margin-bottom:10px; font-weight:700;}
.error-msg{color:#ff8a80; font-size:13px; margin:-6px 0 12px; text-align:center;}

/* --- Kartenfächer (Sicherer Modus) --- */
.fan-wrap{display:flex; justify-content:center; align-items:flex-end; padding:22px 0 10px; min-height:180px;}
.fan-card{
  width:80px; background:linear-gradient(180deg,var(--gold-2),#d9860f); border-radius:10px; padding:6px;
  margin-left:-20px; transform:rotate(var(--rot,0deg)); transition:.15s ease; box-shadow:0 4px 10px rgba(0,0,0,.3);
  cursor:pointer;
}
.fan-card:first-child{margin-left:0;}
.fan-card.fan-selected{
  transform:translateY(-18px) scale(1.18) !important; box-shadow:0 0 0 3px var(--gold-1), 0 10px 22px rgba(0,0,0,.45);
  z-index:5; margin-left:4px; margin-right:4px;
}
.fan-photo{width:100%; aspect-ratio:3/4; border-radius:6px; overflow:hidden; background:rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; margin-bottom:4px;}
.fan-photo img{width:100%; height:100%; object-fit:cover;}
.fan-name{font-size:8.5px; font-weight:700; color:#3a2205; text-align:center; line-height:1.15;}

/* --- Wisch-Karte --- */
.swipe-zone{background:#1c2029; border-radius:14px; padding:12px; overflow:hidden; position:relative;}
.swipe-card{
  background:linear-gradient(180deg,var(--gold-2),#d9860f); border-radius:10px; padding:14px 16px;
  display:flex; justify-content:space-between; align-items:center; font-weight:700; color:#3a2205;
  touch-action:pan-y; cursor:grab; position:relative; left:0; transition:left .2s, opacity .2s; user-select:none;
}
.swipe-card .val{color:#3a2205; font-size:16px;}
.swipe-hint{text-align:center; font-size:11px; color:var(--text-dim); margin-top:8px;}

/* --- Popup --- */
.popup-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.62); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;}
.popup-box{background:var(--bg-panel); border-radius:16px; padding:22px; max-width:340px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5);}
.popup-box h3{font-size:16px; margin-bottom:14px; color:var(--gold-1);}
.popup-player-btn{display:block; width:100%; padding:13px; margin-bottom:8px; border-radius:10px; background:#1c2029; color:var(--foam); font-size:15px; border:1px solid #454b60;}
.popup-player-btn.shake{animation:shake .4s;}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.popup-err{color:#ff8a80; font-size:12px; margin-bottom:10px;}

.bubbles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.bubble{position:absolute; bottom:-30px; background:rgba(245,166,35,0.18); border-radius:50%; animation:rise linear infinite;}
@keyframes rise{to{transform:translateY(-110vh);}}
.footer-note{text-align:center; font-size:11px; color:#5c6178; margin-top:20px;}
.exit-fab{
  position:fixed; top:14px; right:14px; z-index:40; width:38px; height:38px; border-radius:50%;
  background:#1c2029; color:var(--text-dim); border:1px solid #454b60; font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.exit-fab:active{background:#2b3040;}
.preview-nav{display:flex; gap:10px; margin-top:6px;}
.preview-counter{text-align:center; font-size:12px; color:var(--text-dim); margin-bottom:8px;}
.winner-screen{text-align:center; padding:30px 0;}
.winner-screen .trophy{font-size:64px;}
.winner-screen h2{font-size:26px; color:var(--gold-1); margin:10px 0;}
</style>
</head>

const CARD_MAP = Object.fromEntries(CARDS.map(c=>[c.id,c]));

function getCats(settings){
  const lw = (settings && settings.lowWins) || {};
  return [
    {key:"price", label:"Preis", lowWins:true},
    {key:"genuss", label:"Genuss", lowWins:false},
    {key:"seltenheit", label:"Seltenheit", lowWins:!!lw.seltenheit},
    {key:"eskalation", label:"Eskalationspotenzial", lowWins:!!lw.eskalation},
    {key:"assi", label:"Assi-Faktor", lowWins:!!lw.assi},
  ];
}
function defaultSettings(){
  return { lowWins:{seltenheit:false, eskalation:false, assi:false}, safeMode:false };
}
function fmtVal(cat, v){
  if(cat.key==="price") return v.toFixed(2).replace(".",",")+"€";
  return (v%1===0? v.toFixed(0): v.toFixed(1).replace(".",",") );
}

/* ============ BOT-LOGIK ============ */
function isBot(id, data){ return !!(data && data.players && data.players[id] && data.players[id].isBot); }

function computeCategoryMinMax(){
  const keys = ['price','genuss','seltenheit','eskalation','assi'];
  const mm = {};
  keys.forEach(k=>{
    const vals = CARDS.map(c=>c[k]);
    mm[k] = { min: Math.min(...vals), max: Math.max(...vals) };
  });
  return mm;
}
const CATEGORY_MINMAX = computeCategoryMinMax();

// 0..1, 1 = für den Bot bestmöglicher Wert in dieser Kategorie (unter Berücksichtigung höher/niedriger gewinnt)
function botCategoryScore(card, cat){
  const mm = CATEGORY_MINMAX[cat.key];
  const range = (mm.max - mm.min) || 1;
  const norm = (card[cat.key] - mm.min) / range;
  return cat.lowWins ? (1 - norm) : norm;
}
function pickAmongTiesRandom(list, scoreFn){
  const scores = list.map(item=>({item, score:scoreFn(item)}));
  const maxScore = Math.max(...scores.map(s=>s.score));
  const eps = 1e-9;
  const best = scores.filter(s=>Math.abs(s.score-maxScore)<eps);
  return best[Math.floor(Math.random()*best.length)].item;
}
// Beste Kategorie für eine feste Karte (bei gleich guten Kategorien 50/50)
function botChooseCategory(card, cats){
  const best = pickAmongTiesRandom(cats, cat=>botCategoryScore(card, cat));
  return best.key;
}
// Beste Karte+Kategorie-Kombination aus mehreren verfügbaren Karten (Kartenfächer-Wahl)
function botBestCardCategory(cardIds, cats){
  const combos = [];
  cardIds.forEach(cid=>{
    const card = CARD_MAP[cid];
    cats.forEach(cat=>{ combos.push({cardId:cid, catKey:cat.key}); });
  });
  const best = pickAmongTiesRandom(combos, combo=>botCategoryScore(CARD_MAP[combo.cardId], cats.find(c=>c.key===combo.catKey)));
  return best;
}
// Beste Karte aus mehreren, für eine bereits feststehende Kategorie
function botBestCardForCategory(cardIds, cat){
  const best = pickAmongTiesRandom(cardIds, cid=>botCategoryScore(CARD_MAP[cid], cat));
  return best;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function showErr(msg){ const e=document.getElementById('err'); if(e) e.textContent = msg; }

function createRoom(){
  const code = genCode();
  const ref = db.ref('rooms/'+code);
  const initial = {
    hostId: myId,
    state: 'lobby',
    createdAt: Date.now(),
    players: { [myId]: { name: myName, connected:true, joinedAt: Date.now() } },
    settings: defaultSettings(),
  };
  ref.set(initial).then(()=>{ enterRoom(code); }).catch(err=>showErr('Fehler: '+err.message));
}
function joinRoom(code){
  const ref = db.ref('rooms/'+code);
  ref.get().then(snap=>{
    if(!snap.exists()){ showErr('Diesen Raum gibt es nicht.'); return; }
    const data = snap.val();
    if(data.state && data.state!=='lobby'){ showErr('Das Spiel läuft schon.'); return; }
    const existingIds = Object.keys(data.players||{});
    if(!existingIds.includes(myId) && existingIds.length>=4){ showErr('Raum ist voll (max. 4 Spieler).'); return; }
    ref.child('players/'+myId).set({name:myName, connected:true, joinedAt:Date.now()}).then(()=>{
      enterRoom(code);
    });
  }).catch(err=>showErr('Fehler: '+err.message));
}

function enterRoom(code){
  roomCode = code;
  roomRef = db.ref('rooms/'+code);
  previewOpen = false; previewIdx = 0;
  localStorage.setItem('bq_roomcode', code);
  roomRef.child('players/'+myId+'/connected').set(true);
  roomRef.child('players/'+myId+'/connected').onDisconnect().set(false);
  showExitBtn();
  if(roomListener) roomRef.off('value', roomListener);
  roomListener = roomRef.on('value', snap=>{
    lastRoomData = snap.val();
    if(!lastRoomData){
      localStorage.removeItem('bq_roomcode');
      renderHome();
      return;
    }
    renderRoom(lastRoomData);
  });
}

}

function dealHint(n){
  const perPlayer = Math.floor(CARDS.length / n);
  const removed = CARDS.length - perPlayer*n;
  return `Startspieler zufällig · ${perPlayer} Karten pro Spieler`
    + (removed>0 ? ` · ${removed} Karte${removed===1?'':'n'} fliegen zufällig raus` : '');
}

function leaveRoom(){
  if(roomRef){
    roomRef.child('players/'+myId).remove();
    roomRef.off('value', roomListener);
  }
  roomCode=null; roomRef=null; lastRoomData=null;
  localStorage.removeItem('bq_roomcode');
  hideExitBtn();
  renderHome();
}

function startGame(data){
  const ids = Object.keys(data.players||{});
  const total = CARDS.length;
  const perPlayer = Math.floor(total / ids.length);
  const usedCount = perPlayer * ids.length;
  const removedCount = total - usedCount;

  // Falls Karten raus müssen: Home-Office-Bierchen wird zuerst geopfert, Rest zufällig
  const priorityOut = ['homeoffice'];
  let toRemove = [];
  if(removedCount>0){
    priorityOut.forEach(id=>{ if(toRemove.length<removedCount && CARD_MAP[id]) toRemove.push(id); });
    let rest = shuffle(CARDS.map(c=>c.id).filter(id=>!toRemove.includes(id)));
    while(toRemove.length<removedCount){ toRemove.push(rest.pop()); }
  }
  const deck = shuffle(CARDS.map(c=>c.id).filter(id=>!toRemove.includes(id)));

  const queues = {};
  ids.forEach(id=>queues[id]=[]);
  deck.forEach((cid,i)=>{ queues[ids[i%ids.length]].push(cid); });
  const order = shuffle(ids); // zufälliger Startspieler = order[0]
  const update = {
    state:'playing', order, queues, currentPlayer: order[0], phase:'choosing',
    chosenCategory:null, potCards:[], revealCards:{}, round:1, lastResult:null,
    roundCard:{}, pendingSelectors:[], handovers:{}, _resolverId:null,
    removedCount, perPlayer,
  };
  roomRef.update(update);
}

/* ============ SPIELLOGIK ============ */
function eligibleForFan(id, data){
  const s = data.settings||{};
  if(!s.safeMode) return false;
  const q = (data.queues||{})[id]||[];
  if(q.length===0 || q.length>3) return false;
  if((data.roundCard||{})[id]) return false;
  return true;
}

function renderGame(data){
  const cats = getCats(data.settings);
  const players = data.players||{};
  const order = data.order||[];
  const queues = data.queues||{};
  const roundCard = data.roundCard||{};
  const isMyTurn = data.currentPlayer===myId;
  const activeName = players[data.currentPlayer] ? players[data.currentPlayer].name : '?';

  subtitle.textContent = `Runde ${data.round||1}`;
  footnote.textContent = `Raum ${roomCode}`;

  let standings = order.map(id=>({id, name: players[id]?players[id].name:'?', n:(queues[id]||[]).length}));
  let html = '<div class="card-panel"><label>Kartenstand</label>';
  standings.forEach(s=>{
    html += `<div class="mini-card ${s.id===myId?'you-row':''}"><span>${s.id===data.currentPlayer?'👉 ':''}${s.name}${s.id===myId?' (du)':''}</span><span class="val">${s.n}</span></div>`;
  });
  html += '</div>';

  const myQueue = queues[myId]||[];

  if(data.phase==='choosing'){
    html += renderChoosingPhase(data, cats, myQueue, isMyTurn, activeName);
  } else if(data.phase==='selecting'){
    html += renderSelectingPhase(data, cats);
  } else if(data.phase==='result' && data.lastResult){
    html += data.lastResult.tie ? renderResultTie(data, cats) : renderResultNonTie(data, cats);
  }

  app.innerHTML = html;

  if(data.phase==='choosing') attachChoosingHandlers(data, isMyTurn);
  if(data.phase==='selecting') attachSelectingHandlers(data);
  if(data.phase==='result' && data.lastResult) attachResultHandlers(data);

  // Auto-Fortschritt, wenn alle Auswahlen/Abgaben abgeschlossen sind
  if(data.phase==='selecting' && !resolving){
    const resolverIsMe = data._resolverId===myId;
    const resolverIsBotViaHost = data.hostId===myId && isBot(data._resolverId, data);
    if(resolverIsMe || resolverIsBotViaHost){
      const stillPending = (data.pendingSelectors||[]).filter(id=>!roundCard[id]);
      if(stillPending.length===0){ beginResolving(); finalizeReveal(data, data.chosenCategory, data._resolverId); }
    }
  }
  runBotLogic(data);
}

/* ============ BOT-STEUERUNG (übernommen vom Host-Client) ============ */
function runBotLogic(data){
  if(data.hostId!==myId || resolving) return;
  const cats = getCats(data.settings);

  if(data.phase==='choosing'){
    const active = data.currentPlayer;
    if(!isBot(active, data)) return;
    const queue = (data.queues||{})[active]||[];
    if(queue.length===0) return;
    beginResolving();
    setTimeout(()=>{
      try{
        if(eligibleForFan(active, data)){
          const pick = botBestCardCategory(queue, cats);
          roomRef.update({['roundCard/'+active]: pick.cardId}).then(()=>{
            chooseCategory(data, pick.catKey, active);
          }).catch(()=>{ resolving=false; });
        } else {
          const card = CARD_MAP[queue[0]];
          const catKey = botChooseCategory(card, cats);
          chooseCategory(data, catKey, active);
        }
      } catch(e){ resolving=false; }
    }, 600);
    return;
  }

  if(data.phase==='selecting'){
    const pending = (data.pendingSelectors||[]).filter(id=>!(data.roundCard||{})[id]);
    const botPending = pending.filter(id=>isBot(id, data));
    if(botPending.length===0) return;
    beginResolving();
    const cat = cats.find(c=>c.key===data.chosenCategory);
    setTimeout(()=>{
      try{
        const updates = {};
        botPending.forEach(id=>{
          const q = (data.queues||{})[id]||[];
          updates['roundCard/'+id] = botBestCardForCategory(q, cat);
        });
        roomRef.update(updates).then(()=>{ resolving=false; }).catch(()=>{ resolving=false; });
      } catch(e){ resolving=false; }
    }, 500);
    return;
  }

  // Kein automatisches Weiterklicken für Bots — das übernimmt der Mensch per "Weiter"-Button.
}

function renderChoosingPhase(data, cats, myQueue, isMyTurn, activeName){
  if(myQueue.length===0){
    return `<div class="card-panel"><div class="turn-banner">Du bist raus — keine Karten mehr. Schau zu! 🍺</div></div>`;
  }
  if(isMyTurn){
    if(eligibleForFan(myId, data)){
      return `<div class="turn-banner">🎯 Du bist dran! Wähle zuerst deine Karte (letzte ${myQueue.length}).</div>
        <div class="card-panel">${renderFan(myQueue)}
          <button class="btn-primary" id="fanConfirmBtn" disabled>Diese Karte spielen</button>
        </div>`;
    }
    const myCard = CARD_MAP[(data.roundCard||{})[myId] || myQueue[0]];
    return `<div class="turn-banner">🎯 Du bist dran! Wähle eine Kategorie.</div>${cardStackWrap(renderBeerCard(myCard, true, cats), myQueue.length)}`;
  }
  const banner = `<div class="turn-banner">${activeName} überlegt gerade…</div>`;
  if(eligibleForFan(myId, data)){
    return banner + `<div class="card-panel hint">Du darfst gleich (nach der Kategorie-Wahl) aus deinen letzten ${myQueue.length} Karten wählen.</div>`;
  }
  const myCard = CARD_MAP[myQueue[0]];
  return banner + cardStackWrap(renderBeerCard(myCard, false, cats), myQueue.length);
}
function attachChoosingHandlers(data, isMyTurn){
  if(!isMyTurn) return;
  if(eligibleForFan(myId, data)){
    attachFanHandlers((cardId)=>{ roomRef.update({['roundCard/'+myId]: cardId}); });
  } else {
    document.querySelectorAll('.stat-row.pickable').forEach(el=>{
      el.onclick = ()=>{
        if(resolving) return;
        beginResolving();
        chooseCategory(data, el.dataset.cat);
      };
    });
  }
}

function chooseCategory(data, catKey, actingId){
  actingId = actingId || myId;
  const order = data.order;
  const queues = data.queues||{};
  const roundCard = data.roundCard||{};
  const safe = data.settings && data.settings.safeMode;
  const pending = order.filter(id=>{
    if(id===actingId) return false;
    const q = queues[id]||[];
    if(q.length===0 || q.length>3) return false;
    if(!safe) return false;
    if(roundCard[id]) return false;
    return true;
  });
  if(pending.length===0){
    finalizeReveal(data, catKey, actingId);
  } else {
    roomRef.update({ chosenCategory: catKey, phase:'selecting', pendingSelectors: pending, _resolverId: actingId })
      .then(()=>{ resolving=false; });
  }
}

function renderSelectingPhase(data, cats){
  const cat = cats.find(c=>c.key===data.chosenCategory);
  const pending = (data.pendingSelectors||[]).filter(id=>!(data.roundCard||{})[id]);
  const players = data.players;
  if(pending.includes(myId)){
    const myQueue = (data.queues||{})[myId]||[];
    return `<div class="turn-banner">Kategorie: ${cat.label} — wähle deine Karte!</div>
      <div class="card-panel">${renderFan(myQueue)}
        <button class="btn-primary" id="fanConfirmBtn" disabled>Diese Karte spielen</button>
      </div>`;
  }
  return `<div class="turn-banner">Kategorie: ${cat.label}</div>
    <div class="card-panel"><div class="hint">Warte auf: ${pending.map(id=>players[id]?players[id].name:'?').join(', ')||'…'}</div></div>`;
}
function attachSelectingHandlers(data){
  const pending = (data.pendingSelectors||[]).filter(id=>!(data.roundCard||{})[id]);
  if(pending.includes(myId)){
    attachFanHandlers((cardId)=>{ roomRef.update({['roundCard/'+myId]: cardId}); });
  }
}

function finalizeReveal(data, catKey, actingId){
  actingId = actingId || myId;
  const cats = getCats(data.settings);
  const cat = cats.find(c=>c.key===catKey);
  const order = data.order;
  const queues = data.queues||{};
  const roundCard = data.roundCard||{};
  const reveal = {};
  order.forEach(id=>{
    const q = queues[id]||[];
    if(q.length===0) return;
    reveal[id] = roundCard[id] || q[0];
  });
  let bestId=null, bestVal=null, tie=false;
  Object.keys(reveal).forEach(id=>{
    const v = CARD_MAP[reveal[id]][catKey];
    if(bestVal===null){ bestVal=v; bestId=id; return; }
    const better = cat.lowWins ? v<bestVal : v>bestVal;
    const equal = v===bestVal;
    if(better){ bestVal=v; bestId=id; tie=false; }
    else if(equal){ tie=true; }
  });
  const tiedIds = tie ? Object.keys(reveal).filter(id=>CARD_MAP[reveal[id]][catKey]===bestVal) : [bestId];

  roomRef.update({
    phase:'result', chosenCategory: catKey, revealCards: reveal,
    lastResult: { tie, winnerId: tie?null:bestId, tiedIds, wonCount: Object.keys(reveal).length + (data.potCards||[]).length },
    handovers: {},
    _resolverId: tie ? actingId : bestId,
  }).then(()=>{ resolving=false; });
}

function renderResultTie(data, cats){
  const reveal = data.revealCards||{}; const players = data.players;
  const cat = cats.find(c=>c.key===data.chosenCategory);
  let html = `<div class="card-panel"><div class="result-msg">Kategorie: ${cat.label}</div>`;
  data.order.forEach(id=>{
    if(!(id in reveal)) return;
    const c = CARD_MAP[reveal[id]];
    html += `<div class="mini-card ${id===myId?'you-row':''}"><span>${players[id]?players[id].name:'?'}${id===myId?' (du)':''}</span><span class="val">${fmtVal(cat,c[data.chosenCategory])}</span></div>`;
  });
  html += `<div class="pot-note">Gleichstand! Karten wandern in den Pott, nächste Runde direkt weiter…</div>`;
  const buttonOwner = isBot(data._resolverId, data) ? data.hostId : data._resolverId;
  if(buttonOwner===myId){
    html += `<button class="btn-primary" id="continueBtn">Weiter ➡️</button>`;
  } else {
    html += `<div class="hint">Warte, bis es weitergeht…</div>`;
  }
  html += `</div>`;
  return html;
}
function renderResultNonTie(data, cats){
  const reveal = data.revealCards||{}; const winnerId = data.lastResult.winnerId;
  const players = data.players;
  const cat = cats.find(c=>c.key===data.chosenCategory);
  let html = `<div class="card-panel"><div class="result-msg">Kategorie: ${cat.label}</div>`;
  data.order.forEach(id=>{
    if(!(id in reveal)) return;
    const c = CARD_MAP[reveal[id]];
    const isWinner = id===winnerId;
    html += `<div class="mini-card ${isWinner?'win-row':''} ${id===myId?'you-row':''}">
      <span>${isWinner?'🏆 ':''}${players[id]?players[id].name:'?'}${id===myId?' (du)':''}</span>
      <span class="val">${fmtVal(cat, c[data.chosenCategory])}</span></div>`;
  });
  const wName = players[winnerId] ? players[winnerId].name : '?';
  html += `<div class="result-msg">${wName} kassiert alle Karten!</div>`;
  const buttonOwner = isBot(winnerId, data) ? data.hostId : winnerId;
  if(buttonOwner===myId){
    html += `<button class="btn-primary" id="continueBtn">Weiter ➡️</button>`;
  } else {
    html += `<div class="hint">Warte auf ${players[buttonOwner]?players[buttonOwner].name:'?'}…</div>`;
  }
  html += `</div>`;
  return html;
}
function attachResultHandlers(data){
  const btn = document.getElementById('continueBtn');
  if(btn){
    btn.onclick = ()=>{
      if(resolving) return;
      beginResolving();
      advanceAfterResult(data);
    };
  }
}

function advanceAfterResult(data){
  const order = data.order;
  const queues = JSON.parse(JSON.stringify(data.queues||{}));
  const reveal = data.revealCards||{};
  const roundCard = data.roundCard||{};
  const pot = [...(data.potCards||[])];
  const result = data.lastResult;

  Object.keys(reveal).forEach(id=>{
    const playedId = roundCard[id];
    if(playedId){
      queues[id] = (queues[id]||[]).filter(cid=>cid!==playedId);
    } else {
      queues[id] = (queues[id]||[]).slice(1);
    }
  });

  let nextPlayer, nextPot=[];
  if(result.tie){
    nextPot = [...pot, ...Object.values(reveal)];
    const stillIn = order.filter(id=>(queues[id]||[]).length>0);
    nextPlayer = stillIn.length? stillIn[0] : order[0];
  } else {
    const winner = result.winnerId;
    const wonCards = [...pot, ...Object.values(reveal)];
    queues[winner] = [...(queues[winner]||[]), ...shuffle(wonCards)];
    nextPlayer = winner;
  }

  const withCards = order.filter(id=>(queues[id]||[]).length>0);
  if(withCards.length<=1){
    roomRef.update({ state:'finished', queues, winnerFinal: withCards[0]||nextPlayer, phase:'result' })
      .then(()=>{ resolving=false; });
    return;
  }
  if((queues[nextPlayer]||[]).length===0){
    const idx = order.indexOf(nextPlayer);
    for(let i=1;i<=order.length;i++){
      const cand = order[(idx+i)%order.length];
      if((queues[cand]||[]).length>0){ nextPlayer=cand; break; }
    }
  }

  roomRef.update({
    queues, currentPlayer: nextPlayer, phase:'choosing',
    chosenCategory:null, revealCards:{}, potCards: nextPot,
    round: (data.round||1)+1, lastResult:null, handovers:{}, roundCard:{}, pendingSelectors:[],
    _resolverId:null,
  }).then(()=>{ resolving=false; });
}

function renderFinished(data){
  const players = data.players||{};
  const wName = players[data.winnerFinal] ? players[data.winnerFinal].name : '?';
  subtitle.textContent = 'Spiel vorbei';
  footnote.textContent = '';
  app.innerHTML = `
    <div class="card-panel winner-screen">
      <div class="trophy">🏆🍺</div>
      <h2>${wName} hat alle Bierchen!</h2>
      <div class="hint">Wer verliert, holt die nächste Runde.</div>
      <button class="btn-primary" id="againBtn">Nochmal spielen</button>
      <button class="btn-secondary" id="leaveBtn2">Raum verlassen</button>
    </div>
  `;
  document.getElementById('againBtn').onclick = ()=>{ if(data.hostId===myId){ startGame(data); } };
  document.getElementById('leaveBtn2').onclick = leaveRoom;
  if(data.hostId!==myId){ document.getElementById('againBtn').disabled=true; }
}

/* ============ INIT ============ */
const savedRoomCode = localStorage.getItem('bq_roomcode');
if(savedRoomCode && myName){
  enterRoom(savedRoomCode);
} else {
  renderHome();
}
</script>
